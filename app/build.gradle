plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alisinan.minicalc'
    compileSdk 34
    defaultConfig {
        applicationId 'com.alisinan.minicalc'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.2'
        resourceConfigurations += ['en']
    }
    signingConfigs {
        release {
            // Release keystore lives outside the repo and is never committed.
            // Path: local.properties `release.keystore`, or RELEASE_KEYSTORE_FILE.
            // Passwords come only from the environment, never committed:
            // RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.
            // Without a key (e.g. CI) falls back to debug signing.
            def locProps = new Properties()
            def locFile = file("${rootDir}/local.properties")
            if (locFile.exists()) locFile.withInputStream { locProps.load(it) }
            def ksPath = locProps.getProperty("release.keystore")
                    ?: System.getenv("RELEASE_KEYSTORE_FILE")
            def ksFile = ksPath ? file(ksPath) : null
            def storePw = System.getenv("RELEASE_STORE_PASSWORD")
            def alias = System.getenv("RELEASE_KEY_ALIAS")
            def keyPw = System.getenv("RELEASE_KEY_PASSWORD")
            if (ksFile != null && ksFile.exists() && storePw && alias && keyPw) {
                storeFile ksFile
                storePassword storePw
                keyAlias alias
                keyPassword keyPw
            } else {
                println("WARNING: release keystore unavailable, signing with debug key")
                storeFile file("${System.getProperty("user.home")}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/**', 'DebugProbesKt.bin',
                         'kotlin/**', '**/*.kotlin_builtins', '**/*.kotlin_metadata']
        }
    }
}

dependencies {
}